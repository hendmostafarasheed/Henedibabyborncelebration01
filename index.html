<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دعوة سبوع محمد هنيدي</title><style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f8ead7;color:#244e68;font-family:Cairo,Tahoma,sans-serif}.screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}.cover{position:relative;overflow:hidden;width:min(100%,510px);min-height:min(850px,94dvh);border:8px solid #f3d9b4;border-radius:26px;background:radial-gradient(circle at 50% 45%,#fffaf0 0%,#f9e8d1 85%);box-shadow:0 15px 45px #7a4e3150;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:55px 20px}.cover:before{content:'';position:absolute;top:0;left:0;right:0;height:115px;background:repeating-linear-gradient(105deg,#b74e48 0 40px,#fff0dc 40px 80px);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);opacity:.9}.stars{font-size:32px;letter-spacing:15px;color:#dca75e;margin:25px 0}.eyebrow{font-size:20px;margin:14px 0 0}.title{font-family:Amiri,serif;font-size:clamp(54px,12vw,80px);color:#b6484a;line-height:1.3;margin:0}.subtitle{font-size:20px;font-weight:700;line-height:1.9}.badge{font-size:70px;margin:5px}.button{border:0;border-radius:40px;background:linear-gradient(135deg,#d66b69,#b94b52);color:white;font:800 21px Cairo,Tahoma,sans-serif;padding:14px 42px;cursor:pointer;box-shadow:0 8px 0 #92383e,0 13px 25px #ad555355;margin-top:25px}.button:active{transform:translateY(4px);box-shadow:0 4px 0 #92383e}.foot{margin-top:32px;font-size:16px}.invite{display:none;flex-direction:column;gap:12px}.invite img{display:block;width:min(100%,600px);height:auto;border-radius:10px;box-shadow:0 10px 35px #0002}.back{background:#244e68;color:white;border:0;border-radius:20px;padding:8px 24px;font:700 15px Cairo,Tahoma;cursor:pointer}body.open .intro{display:none}body.open .invite{display:flex}@media(max-width:420px){.cover{min-height:88dvh}.subtitle{font-size:17px}}

/* Rainbow page transition */
.rainbow-transition{position:fixed;inset:0;z-index:50;pointer-events:none;display:grid;place-items:center;opacity:0;visibility:hidden;background:rgba(255,248,236,.2);transition:opacity .18s}
.rainbow-transition.active{visibility:visible;opacity:1}
.rainbow-ring{width:175vmax;height:175vmax;border-radius:50%;background:conic-gradient(#ff6e8d,#ffbd59,#fff28a,#77e5b5,#72d9ff,#9c8bff,#ff6e8d);mask:radial-gradient(circle,transparent 0 17%,#000 18% 35%,transparent 36% 43%,#000 44% 56%,transparent 57%);-webkit-mask:radial-gradient(circle,transparent 0 17%,#000 18% 35%,transparent 36% 43%,#000 44% 56%,transparent 57%);transform:scale(.02) rotate(-90deg);opacity:0;filter:drop-shadow(0 0 25px #fff);}
.rainbow-transition.active .rainbow-ring{animation:rainbowPop 1.55s ease-in-out forwards}
@keyframes rainbowPop{0%{transform:scale(.02) rotate(-90deg);opacity:0}18%{opacity:1}53%{transform:scale(.92) rotate(65deg);opacity:1}78%{opacity:.9}100%{transform:scale(1.65) rotate(160deg);opacity:0}}
.invite-frame{position:relative;width:min(100%,600px);overflow:hidden;border-radius:10px;box-shadow:0 10px 35px #0002;isolation:isolate}
.invite .invite-frame img{width:100%;border-radius:0;box-shadow:none}
.balls-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.bubble-ball{position:absolute;left:0;top:0;border-radius:50%;border:1px solid rgba(255,255,255,.8);box-shadow:inset -7px -10px 14px rgba(255,255,255,.12),inset 7px 8px 15px rgba(255,255,255,.66),0 5px 13px rgba(81,60,80,.14);opacity:.78;will-change:transform;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,.35) 18%,transparent 43%),radial-gradient(circle at 68% 76%,var(--ball-color),transparent 85%)}
@media(prefers-reduced-motion:reduce){.rainbow-transition.active .rainbow-ring{animation-duration:.25s}.bubble-ball{will-change:auto}}

.action-panel{width:min(100%,600px);padding:19px 14px 22px;border:2px solid #eac48e;border-radius:19px;background:#fff9ed;box-shadow:0 8px 25px #0001;text-align:center}.action-panel h3{font-size:19px;color:#ae4852;margin:0 0 12px}.action-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.action-link{display:flex;align-items:center;justify-content:center;min-height:58px;padding:9px 5px;text-align:center;border:0;border-radius:13px;background:#c45660;color:white;text-decoration:none;font:700 13px Cairo,Tahoma,sans-serif;cursor:pointer}.action-link:nth-child(1){background:#247d81}.action-link:nth-child(3){background:#b57a38}.rsvp-dialog{border:2px solid #eac48e;border-radius:18px;max-width:min(92vw,410px);padding:24px;background:#fffaf0;color:#244e68;box-shadow:0 15px 50px #0005}.rsvp-dialog::backdrop{background:#142735a8}.rsvp-dialog label{display:block;margin:13px 0 5px;font-weight:700}.rsvp-dialog input{width:100%;border:1px solid #d7b998;border-radius:9px;padding:10px;font:16px Cairo,Tahoma}.dialog-actions{display:flex;gap:8px;margin-top:20px}.dialog-actions button{flex:1;border:0;border-radius:12px;padding:12px 5px;font:700 14px Cairo,Tahoma;cursor:pointer;background:#c45660;color:white}.dialog-actions .cancel{background:#777}.feedback{font-size:13px;min-height:20px;margin:9px 0 0;color:#247d81}@media(max-width:380px){.action-buttons{grid-template-columns:1fr}.action-link{min-height:43px}}

/* Royal circus cover — new first page only */
.intro{background:radial-gradient(ellipse at 50% 40%,#fff5df 0%,#f2d6a9 70%,#d9b37d 100%);padding:14px}
.royal-cover{position:relative;isolation:isolate;overflow:hidden;width:min(100%,510px);min-height:min(850px,95dvh);padding:154px 25px 65px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:6px solid #b78735;border-radius:145px 145px 26px 26px;background:radial-gradient(ellipse at 50% 42%,#fffdf2 0%,#fff3db 53%,#f7dcaf 100%);box-shadow:0 0 0 4px #fff0c8 inset,0 18px 45px #5a251b55;color:#81272b}
.royal-cover:before,.royal-cover:after{content:"";position:absolute;top:0;bottom:0;width:17%;z-index:-1;background:repeating-linear-gradient(90deg,#8f1e2c 0 20%,#ba3340 20% 48%,#7d1726 48% 65%,#cc4350 65% 100%);filter:drop-shadow(3px 0 4px #5d192355)}
.royal-cover:before{left:0;clip-path:polygon(0 0,100% 0,78% 27%,100% 65%,70% 100%,0 100%)}
.royal-cover:after{right:0;transform:scaleX(-1);clip-path:polygon(0 0,100% 0,78% 27%,100% 65%,70% 100%,0 100%)}
.curtain-top{position:absolute;top:0;left:0;right:0;height:142px;background:repeating-linear-gradient(90deg,#7f1725 0 9%,#c43742 9% 19%,#8e1e2c 19% 29%);border-bottom:7px solid #e4b75a;clip-path:ellipse(83% 100% at 50% 0)}
.curtain-valance{position:absolute;bottom:0;width:100%;height:18px;background:repeating-radial-gradient(circle at 12px 0,#f5d47e 0 3px,transparent 4px 24px)}
.royal-stars{position:absolute;top:143px;color:#d1a34b;font-size:24px;letter-spacing:9px;animation:twinkle 2.6s ease-in-out infinite alternate}
.crown{font-size:55px;line-height:1;color:#c49535;text-shadow:0 2px 0 #fff4c8;margin:0 0 12px}
.royal-small{font-size:15px;font-weight:700;color:#9b6940}
.royal-heading{font-family:Amiri,serif;font-size:clamp(52px,12vw,76px);line-height:1.35;margin:3px 0;color:#9b2533;text-shadow:1px 2px 0 #f4d9a7}
.royal-divider{color:#c49a45;letter-spacing:12px;font-size:22px}
.royal-message{font-size:17px;line-height:2;font-weight:700;color:#86513c;margin:14px 0}
.royal-name{font-family:Amiri,serif;font-size:clamp(46px,11vw,66px);line-height:1.4;margin:0;color:#9e2832;text-shadow:1px 2px #e9bf7b}
.royal-sparkle{font-size:24px;color:#b98b32;margin:5px 0 16px;animation:twinkle 2s infinite alternate}
.ticket-button{position:relative;border:2px dashed #fff1bb;outline:3px solid #b78632;border-radius:12px;background:linear-gradient(120deg,#e3bb60,#fff1b3 43%,#d6a345);padding:16px 24px;color:#812a2e;font:800 21px Cairo,Tahoma,sans-serif;cursor:pointer;box-shadow:0 7px 0 #9d702f,0 14px 20px #8d5c3544;transition:transform .2s,box-shadow .2s;animation:ticketFloat 2.7s ease-in-out infinite}
.ticket-button:before,.ticket-button:after{content:"";position:absolute;top:50%;width:17px;height:17px;background:#fff2d8;border-radius:50%;transform:translateY(-50%)}
.ticket-button:before{left:-11px}.ticket-button:after{right:-11px}
.ticket-button:hover{transform:translateY(-3px) scale(1.03)}.ticket-button:active{transform:translateY(5px);box-shadow:0 2px 0 #9d702f}
.royal-footer{font-size:14px;font-weight:700;color:#9b6940;margin:24px 0 0}
.royal-stage{position:absolute;bottom:0;left:0;right:0;height:21px;background:repeating-linear-gradient(90deg,#a32b35 0 28px,#d5a44a 28px 36px)}
.royal-balloons{position:absolute;top:40%;display:flex;flex-direction:column;gap:18px;font-size:36px;opacity:.75;pointer-events:none;animation:balloonFloat 4s ease-in-out infinite alternate}
.royal-balloons.left{left:5%}.royal-balloons.right{right:5%;animation-delay:-2s}.royal-balloons span:nth-child(2){font-size:27px;margin-inline-start:15px}
@keyframes balloonFloat{to{transform:translateY(-18px) rotate(5deg)}}@keyframes twinkle{to{opacity:.45;transform:scale(.94)}}@keyframes ticketFloat{50%{translate:0 -5px}}
@media(max-width:420px){.royal-cover{min-height:90dvh;padding:130px 22px 50px;border-radius:100px 100px 22px 22px}.curtain-top{height:116px}.royal-stars{top:119px;font-size:18px}.royal-balloons{font-size:25px;opacity:.45}.royal-message{font-size:15px}.ticket-button{font-size:18px;padding:13px 19px}}
@media(prefers-reduced-motion:reduce){.royal-balloons,.royal-stars,.royal-sparkle,.ticket-button{animation:none}}

const colors=['#ff6d91','#ffb444','#75d9ff','#a893ff','#69dfb2','#ff8d6e','#ffe06a','#e88ce2'];
function initBalls(){
  cancelAnimationFrame(raf);layer.replaceChildren();balls=[];
  const w=frame.clientWidth,h=frame.clientHeight;
  if(!w||!h)return;
  const count=13;
  for(let i=0;i<count;i++){
    const el=document.createElement('span');el.className='bubble-ball';
    const r=Math.max(9,Math.min(22,w*(.022+Math.random()*.026)));
    el.style.width=el.style.height=(r*2)+'px';
    el.style.setProperty('--ball-color',colors[i%colors.length]);
    layer.appendChild(el);
    balls.push({el,r,x:r+Math.random()*(w-2*r),y:h*.06+Math.random()*h*.65,vx:(Math.random()-.5)*2.6,vy:-Math.random()*2-1,phase:Math.random()*6});
  }
  last=performance.now();raf=requestAnimationFrame(tick);
}
function tick(t){
 const dt=Math.min((t-last)/16.67,2);last=t;
 const w=frame.clientWidth,h=frame.clientHeight;
 for(const b of balls){
  b.vy+=.12*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}
  if(b.x>w-b.r){b.x=w-b.r;b.vx=-Math.abs(b.vx)}
  if(b.y>h-b.r){b.y=h-b.r;b.vy=-(3.5+Math.random()*2.7)}
  if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
  b.el.style.transform=`translate3d(${b.x-b.r}px,${b.y-b.r}px,0)`;
 }
 raf=requestAnimationFrame(tick);
}
function go(open){
 if(transitioning)return;transitioning=true;
 overlay.classList.remove('active');void overlay.offsetWidth;overlay.classList.add('active');
 setTimeout(()=>{
  document.body.classList.toggle('open',open);window.scrollTo(0,0);
  if(open)initBalls();else{cancelAnimationFrame(raf);balls=[];layer.replaceChildren()}
 },620);
 setTimeout(()=>{overlay.classList.remove('active');transitioning=false},1550);
}
document.getElementById('open').addEventListener('click',()=>go(true));
document.getElementById('back').addEventListener('click',()=>go(false));
window.addEventListener('resize',()=>{if(document.body.classList.contains('open'))initBalls()});

const dialog=document.getElementById('rsvp-dialog');
document.getElementById('rsvp-btn').addEventListener('click',()=>dialog.showModal());
document.getElementById('close-rsvp').addEventListener('click',()=>dialog.close());
document.getElementById('rsvp-form').addEventListener('submit',e=>{
 e.preventDefault();
 const name=document.getElementById('guest-name').value.trim();
 const count=document.getElementById('guest-count').value;
 if(!name)return;
 const message=`تأكيد حضور سبوع محمد هنيدي 🎪🎈\nالاسم: ${name}\nعدد الحضور: ${count}`;
 dialog.close();
 window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(message),'_blank','noopener,noreferrer');
});
document.getElementById('share-btn').addEventListener('click',async()=>{
 const note=document.getElementById('share-feedback');
 const url=location.protocol==='file:'?'':location.href;
 const message='🎪🎈 مستنيينكم في سبوع محمد هنيدي! افتحوا الدعوة وشرفونا ❤️';
 if(navigator.share && url){try{await navigator.share({title:'دعوة سبوع محمد هنيدي',text:message,url});return}catch(e){if(e.name==='AbortError')return}}
 if(url){try{await navigator.clipboard.writeText(message+'\n'+url);note.textContent='✅ تم نسخ رابط الدعوة، ابعتيه لأحبابك!';return}catch(e){}}
 window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(message+(url?'\n'+url:'')),'_blank','noopener,noreferrer');
 if(!url)note.textContent='بعد رفع الدعوة على GitHub، زر المشاركة هيشارك لينك الدعوة تلقائيًا.';
});
</script></body></html>
